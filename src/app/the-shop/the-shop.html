<section class="hero">
  <div class="hero-wrapper">
    <div class="container-fluid">
      <h1 class="title">Shop</h1>
      <app-search-filter></app-search-filter>
    </div>
  </div>
</section>

<section class="shop-content">
  <h2 class="title">Best Selling Product</h2>
  <!-- <button type="button" class="back-link" (click)="goBack()">
    &larr; Back
  </button> -->

  <nav class="prod-tabs-cont" #shopTabsWrapper>
    @for (tab of tabs; track tab.name; let i = $index) {
      <a
        #shopTabEl
        class="each-tab"
        [routerLink]="tab.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="scrollActiveTabIntoView(i)"
      >
        {{ tab.label }}
      </a>
    } @empty {
      No tab data availabele!
    }
  </nav>

  <!-- child component will render here -->
  <router-outlet></router-outlet>
</section>
