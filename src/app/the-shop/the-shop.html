<div class="container">
    <!-- Products Listing -->
    <div class="products-listing">
      @for (category of categories; track category) {
        @if (getCoursesByCategory(category).length) {
          <section class="platform-section">
            <h2 class="small-title">
              {{ getCategoryDisplayName(category) | titlecase }}
            </h2>
            <!-- <h2 class="small-title">{{ getPlatformFromCourse(platform) | titlecase }}</h2> -->
            <app-ad-slider [ads]="getCoursesByCategory(category)" [category]="category" />
          </section>
        }
      } @empty {
        <p class="no-courses">No courses available at the moment.</p>
      }
    </div>
    
    <!-- Pagination -->
    @if (totalPages > 1) {
      <nav aria-label="Course pagination">
        <ul class="pagination justify-content-center">
          <li class="page-item" [class.disabled]="currentPage === 1">
            <button
              class="page-link"
              (click)="prevPage()"
              [attr.disabled]="currentPage === 1 ? true : null"
              aria-label="Previous page"
            >
              &lt;
            </button>
          </li>
    
          @for (page of getPageNumbers(); track page) {
            <li class="page-item" [class.active]="currentPage === page">
              <button
                class="page-link"
                (click)="goToPage(page)"
                [attr.aria-current]="currentPage === page ? 'page' : null"
                [attr.aria-label]="'Page ' + page"
              >
                {{ page }}
              </button>
            </li>
          }
    
          <li class="page-item" [class.disabled]="currentPage === totalPages">
            <button
              class="page-link"
              (click)="nextPage()"
              [attr.disabled]="currentPage === totalPages ? true : null"
              aria-label="Next page"
            >
              &gt;
            </button>
          </li>
        </ul>
      </nav>
    }
</div>
