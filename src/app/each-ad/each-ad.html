<div class="each-product">
      <div class="img-cont">
        <img 
          [src]="ad().image" 
          [alt]="ad().name"
          [style.object-fit]="'cover'"
        />
        <div class="icon-cont">
          <i class="fa-regular fa-heart"></i>
        </div>
        <div class="c-badge">BEST SELLING</div>
      </div>

      <div class="product-details">
        <div class="name">
          <a href="#">{{ ad().name }}</a>
        </div>
        <p class="description">{{ ad().description }}</p>
        
        <button 
          class="btn cta" 
          [class.locked]="!isAvailable()"
          (click)="onButtonClick()"
        >
          @if (isAvailable()) {
            Continue Study
          } @else {
            Locked <i class="fa-solid fa-lock"></i>
          }
        </button>
        
        <div class="progress">
          <div 
            class="progress-bar" 
            [style.width.%]="safeProgress()"
          ></div>
        </div>
        <p class="m-0">{{ ad().progress }}% Complete</p>
      </div>
    </div>
