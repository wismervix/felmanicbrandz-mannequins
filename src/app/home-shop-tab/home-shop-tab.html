<section>
  <h2 class="title">Best Selling Product</h2>

  <!-- <app-search-filter/> -->
  <!-- <button type="button" class="back-link" (click)="goBack()">
    &larr; Back
  </button> -->

  <nav class="prod-tabs-cont" #tabsWrapper>
    @for (tab of tabs; track tab.name; let i = $index) {
      <a
        #tabEl
        class="each-tab"
        [routerLink]="tab.route"
        (click)="scrollActiveTabIntoView(i)"
        [ngClass]="{ active: isActiveTab(tab.route) }"
      >
        {{ tab.label }}
      </a>
    } @empty {
      No tab data availabele!
    }
  </nav>

  <!-- child component will render here -->
  <router-outlet></router-outlet>
</section>
