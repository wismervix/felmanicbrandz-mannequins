<nav
  class="navbar navbar-expand-lg custom-navbar glass-overlay"
  [class.nav-visible]="showNavbar"
>
  <div class="container-fluid">
    <!-- <a class="navbar-brand" href="#"><app-svg-icon icon="gitHub" width="50px" /></a> -->
    <a class="navbar-brand" routerLink="/">Manniquin</a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#pageNav"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="pageNav">
      <div class="navbar-nav">
        <a
          class="nav-link"
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="collapseNav()"
          >Home</a
        >
        <a
          class="nav-link active"
          routerLink="/about"
          routerLinkActive="active"
          (click)="collapseNav()"
        >
          About
        </a>
        <a
          class="nav-link active"
          routerLink="/shop"
          routerLinkActive="active"
          (click)="collapseNav()"
          >shop</a
        >
        <a
          class="nav-link"
          routerLink="/contact"
          routerLinkActive="active"
          (click)="collapseNav()"
          >Contact</a
        >
      </div>

      <div class="nav-end">
        <div class="cart-icon" (click)="toggleCart()">
          <span><i class="fa-solid fa-bag-shopping"></i></span>
          <div class="cart-badge">{{ cart.totalQuantity() }}</div>
        </div>
        <span class="time">{{ currentTime }}</span>
      </div>
    </div>
  </div>
</nav>

@if (showCart) {
  <app-cart-modal (closed)="closeCart()" />
}
